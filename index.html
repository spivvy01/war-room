<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLTRS V4.2 - 終極實戰終端</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --main-green: #00ff41; --dim-green: rgba(0, 255, 65, 0.2); --alert-red: #ff003c; }
        body { background: #000; color: var(--main-green); font-family: 'Share Tech Mono', monospace; margin: 0; overflow: hidden; }
        .ui-container { height: 100vh; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; position: relative; z-index: 10; }
        .top-bar { border: 1px solid var(--main-green); padding: 5px 15px; display: flex; justify-content: space-between; background: rgba(0,20,0,0.8); margin-bottom: 10px; font-size: 12px; }
        #radar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .card { background: rgba(0, 15, 0, 0.9); border-left: 3px solid var(--main-green); padding: 10px; border-top: 1px solid var(--dim-green); box-shadow: 0 0 15px rgba(0,255,65,0.1); }
        .card-label { font-size: 10px; text-transform: uppercase; opacity: 0.8; margin-bottom: 5px; }
        .card-value { font-size: 18px; font-weight: bold; text-shadow: 0 0 8px var(--main-green); }
        .control-panel { background: rgba(0, 30, 0, 0.9); border: 1px dashed var(--main-green); padding: 15px; text-align: center; }
        input { background: #000; border: 1px solid var(--main-green); color: var(--main-green); font-family: inherit; width: 120px; padding: 8px; text-align: center; font-size: 18px; margin-bottom: 10px; }
        button { background: var(--main-green); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 2px; }
        .critical { border-left-color: var(--alert-red) !important; color: var(--alert-red) !important; }
        .critical .card-value { text-shadow: 0 0 12px var(--alert-red); animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #api-status { font-size: 9px; opacity: 0.5; text-align: right; margin-top: 8px; }
    </style>
</head>
<body>
    <canvas id="radar-canvas"></canvas>
    <div class="ui-container">
        <div class="top-bar">
            <span>TERMINAL: DLTRS_V4.2_SAT_LINK</span>
            <span id="clock">00:00:00</span>
        </div>
        <div class="stats-grid">
            <div class="card">
                <div class="card-label">1YR ATH LOCK</div>
                <div id="displayAth" class="card-value">--</div>
            </div>
            <div class="card">
                <div class="card-label">NQ LIVE HEIGHT</div>
                <div id="livePrice" class="card-value">SYNCING...</div>
            </div>
            <div id="dropCard" class="card">
                <div class="card-label">DEVIATION %</div>
                <div id="displayDrop" class="card-value">--</div>
            </div>
            <div class="card">
                <div class="card-label">MISSION STATUS</div>
                <div id="signalStatus" class="card-value" style="font-size: 14px;">SCANNING</div>
            </div>
        </div>
        <div style="flex: 1;"></div>
        <div class="control-panel">
            <div class="card-label">MANUAL OVERRIDE ATH</div>
            <input type="number" id="athInput" value="30418">
            <button onclick="updateAth()">ENGAGE COMMAND</button>
            <div id="api-status">INITIALIZING...</div>
        </div>
    </div>

    <script>
        let currentAth = 30418;

        async function fetchNasdaqData() {
            try {
                // 使用更穩定的 Yahoo Finance 公開接口
                const res = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=^NDX`);
                const data = await res.json();
                
                if (data.quoteResponse && data.quoteResponse.result[0]) {
                    const price = data.quoteResponse.result[0].regularMarketPrice;
                    updateUI(price);
                    document.getElementById('api-status').innerText = "SAT_LINK: ACTIVE (NQ100 REALTIME)";
                } else {
                    throw new Error();
                }
            } catch (e) {
                // 備援方案：顯示最後已知價格防止卡死
                document.getElementById('api-status').innerText = "SAT_LINK: WEAK SIGNAL - RETRYING...";
            }
        }

        function updateUI(price) {
            document.getElementById('livePrice').innerText = price.toLocaleString(undefined, {minimumFractionDigits: 2});
            const drop = ((price - currentAth) / currentAth) * 100;
            document.getElementById('displayDrop').innerText = drop.toFixed(2) + "%";
            
            const signal = document.getElementById('signalStatus');
            const dropCard = document.getElementById('dropCard');
            
            if (drop <= -4) {
                dropCard.classList.add('critical');
                signal.innerText = "B-2: NUCLEAR READY";
                signal.style.color = "#ff003c";
            } else {
                dropCard.classList.remove('critical');
                signal.innerText = "AIRSPACE SECURE";
                signal.style.color = "#00ff41";
            }
        }

        function updateAth() {
            currentAth = parseFloat(document.getElementById('athInput').value);
            document.getElementById('displayAth').innerText = currentAth.toLocaleString();
            fetchNasdaqData();
        }

        // 雷達背景動畫
        const canvas = document.getElementById('radar-canvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        function draw() {
            ctx.fillStyle = 'rgba(0, 5, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.moveTo(canvas.width/2, canvas.height/1.5);
            ctx.arc(canvas.width/2, canvas.height/1.5, canvas.width*0.8, angle, angle+0.1);
            ctx.lineTo(canvas.width/2, canvas.height/1.5);
            ctx.fillStyle = 'rgba(0, 255, 65, 0.1)'; ctx.fill();
            angle += 0.05; requestAnimationFrame(draw);
        }
        draw();

        // 初始化
        document.getElementById('displayAth').innerText = currentAth.toLocaleString();
        fetchNasdaqData();
        setInterval(fetchNasdaqData, 30000); // 30秒更新一次
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
