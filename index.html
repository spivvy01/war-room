<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLTRS V6.0 - 實時核武終端</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #00ff41; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; }
        .cockpit { width: 100vw; height: 100vh; border: 4px solid #1a331a; box-sizing: border-box; position: relative; background: radial-gradient(circle, #050a05 0%, #000 100%); }
        .header { text-align: center; border-bottom: 2px solid #00ff41; padding: 10px; background: rgba(0, 255, 65, 0.1); }
        .data-panel { position: absolute; left: 15px; top: 80px; width: 180px; z-index: 10; }
        .data-box { border: 1px solid #00ff41; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.8); }
        .label { font-size: 9px; color: #8f8; letter-spacing: 1px; }
        .value { font-size: 18px; font-weight: bold; }
        .visual-center { position: absolute; width: 100%; height: 60%; top: 20%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .plane-img { width: 300px; filter: drop-shadow(0 0 20px #00ff41); transition: 1.5s; opacity: 0.1; }
        .plane-active { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 40px #00ff41); }
        .nuke-alert { color: #ff0000; font-size: 20px; font-weight: bold; display: none; animation: blink 0.5s infinite; text-align: center; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .radar-scan { position: absolute; bottom: 30px; right: 30px; width: 100px; height: 100px; border: 1px solid #00ff41; border-radius: 50%; }
        .scan-line { width: 50%; height: 2px; background: #00ff41; position: absolute; top: 50%; left: 50%; transform-origin: left center; animation: sweep 2s infinite linear; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="cockpit">
        <div class="header">
            <div style="font-size: 10px;">DLTRS STRATEGIC COMMAND</div>
            <div style="font-size: 20px; font-weight: bold;">零域・核武終端 V6.0</div>
        </div>
        <div class="data-panel">
            <div class="data-box"><div class="label">1YR ATH (歷史高點)</div><div id="ath-val" class="value">30,418.00</div></div>
            <div class="data-box"><div class="label">NQ REAL-TIME (即時高度)</div><div id="price-val" class="value">CONNECTING...</div></div>
            <div class="data-box"><div class="label">DROP % (偏離度)</div><div id="drop-val" class="value">0.00%</div></div>
        </div>
        <div class="visual-center">
            <div id="nuke-msg" class="nuke-alert">☢️ STRATEGIC NUKE READY ☢️</div>
            <img id="plane-view" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/B-2_Spirit_original.png/640px-B-2_Spirit_original.png" class="plane-img">
            <div id="mission-type" style="margin-top: 20px; font-size: 14px; letter-spacing: 3px;">SCANNING...</div>
        </div>
        <div class="radar-scan"><div class="scan-line"></div></div>
    </div>
    <script>
        // 這裡設定您的歷史高點 30418.00
        const ATH = 30418.00; 
        async function updateMarket() {
            try {
                // 自動模擬市場波動 (GitHub Pages 上線後可串接真實數據)
                let currentPrice = ATH * (1 - (Math.random() * 0.25)); 
                let drop = ((currentPrice - ATH) / ATH) * 100;
                document.getElementById('price-val').innerText = currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2});
                document.getElementById('drop-val').innerText = drop.toFixed(2) + "%";
                let plane = document.getElementById('plane-view');
                let mission = document.getElementById('mission-type');
                let nuke = document.getElementById('nuke-msg');

                if (drop <= -20) {
                    plane.className = "plane-img plane-active";
                    mission.innerText = "B-21 RAIDER: 核能裂變啟動";
                    nuke.style.display = "block";
                } else if (drop <= -12) {
                    plane.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/F-35A_Lightning_II_full_color.png/640px-F-35A_Lightning_II_full_color.png";
                    plane.className = "plane-img plane-active";
                    mission.innerText = "F-35 LIGHTNING: 格鬥中";
                    nuke.style.display = "none";
                } else if (drop <= -4) {
                    plane.className = "plane-img plane-active";
                    mission.innerText = "B-2 SPIRIT: 先遣投彈中";
                    nuke.style.display = "none";
                } else {
                    plane.className = "plane-img";
                    mission.innerText = "空域安全：高空監視中";
                }
            } catch (e) {}
        }
        setInterval(updateMarket, 3000);
        updateMarket();
    </script>
</body>
</html>
