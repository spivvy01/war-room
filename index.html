<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLTRS V100.0 - 核心終端</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; margin: 0; overflow: hidden; }
        .cockpit { width: 100vw; height: 100vh; border: 4px solid #1a331a; box-sizing: border-box; position: relative; }
        .header { text-align: center; border-bottom: 2px solid #00ff41; padding: 15px; font-size: 20px; font-weight: bold; background: rgba(0, 255, 65, 0.1); }
        .data-panel { padding: 20px; }
        .data-box { border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; background: rgba(0,255,65,0.05); }
        .label { font-size: 12px; color: #8f8; margin-bottom: 5px; }
        .value { font-size: 24px; font-weight: bold; }
        .plane-box { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 120px; border: 2px dashed #00ff41; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.3; }
        .active { border: 2px solid #00ff41; background: rgba(0,255,65,0.1); opacity: 1; box-shadow: 0 0 20px #00ff41; }
        .radar { position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; border: 1px solid #00ff41; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="cockpit">
        <div class="header">DLTRS V100.0 COMMANDER</div>
        <div class="data-panel">
            <div class="data-box"><div class="label">1YR ATH</div><div class="value">30,418.00</div></div>
            <div class="data-box"><div class="label">NDX REAL-TIME</div><div class="value">29,416.75</div></div>
            <div class="data-box"><div class="label">DROP %</div><div class="value" id="drop">-3.29%</div></div>
        </div>
        <div id="status" class="plane-box">
            <div style="font-size: 10px;">AERIAL STATUS</div>
            <div id="msg" style="font-weight: bold; margin-top: 10px;">SCANNING...</div>
        </div>
        <div class="radar"></div>
    </div>
    <script>
        const ath = 30418;
        const price = 29416.75;
        const drop = ((price - ath) / ath) * 100;
        document.getElementById('drop').innerText = drop.toFixed(2) + "%";
        if (drop <= -4) { 
            document.getElementById('status').className = "plane-box active";
            document.getElementById('msg').innerText = "B-2: COMBAT READY";
        } else {
            document.getElementById('msg').innerText = "SECURE: MONITORING";
        }
    </script>
</body>
</html>
