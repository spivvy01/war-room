<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLTRS V200.0 - 核武級轟炸終端</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 全局軍用背景 */
        body { background: #000; color: #00ff41; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; position: relative; }
        body::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%); z-index: 2; background-size: 100% 4px; pointer-events: none; }
        
        .cockpit { width: 100vw; height: 100vh; border: 8px solid #003310; box-sizing: border-box; position: relative; background: radial-gradient(circle, #051405 0%, #000 100%); display: flex; flex-direction: column; }
        
        /* 螢幕閃爍動畫 */
        @keyframes crt { 0% { opacity: 1; } 5% { opacity: 0.95; } 10% { opacity: 1; } }
        .crt-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 255, 65, 0.03); z-index: 3; animation: crt 0.2s infinite; pointer-events: none; }

        /* 標題區域 (完美版標題) */
        .header { text-align: center; border-bottom: 2px solid #00ff41; padding: 10px; background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 15px #00ff41; position: relative; z-index: 4; }
        .header h1 { margin: 0; font-size: 18px; color: #0f0; text-transform: uppercase; letter-spacing: 3px; }
        .header p { margin: 2px 0 0; font-size: 10px; color: #aaa; text-transform: uppercase; }

        /* 戰術控制台核心佈局 */
        .tactical-grid { display: flex; flex-direction: column; flex: 1; padding: 10px; gap: 10px; position: relative; z-index: 4; }
        
        /* 作戰區域 (圖片一的上半部圖形區域) */
        .war-zone { flex: 1; border: 1px solid #00ff41; background: rgba(0,0,0,0.7); position: relative; overflow: hidden; }
        .war-zone-label { position: absolute; top: 5px; left: 5px; font-size: 9px; letter-spacing: 1px; color: #ff0000; background: rgba(255,0,0,0.1); padding: 2px 5px; }
        
        /* SVG 圖形生成 (模仿圖片一的戰機和圖表) */
        #war-map { width: 100%; height: 100%; }
        .plane { stroke: #00ff41; stroke-width: 2; fill: none; filter: drop-shadow(0 0 10px #00ff41); }
        .enemy-chart { stroke: #ff0000; stroke-width: 1; fill: none; opacity: 0.5; }
        .bombs { fill: #00ff41; }
        @keyframes fall { to { transform: translateY(50px); } }
        .falling-bombs { animation: fall 1s linear infinite; }

        /* 數值面板 (圖片一左側的數字框) */
        .data-panel { display: flex; flex-direction: column; gap: 8px; max-width: 150px; }
        .data-box { border: 2px solid #00ff41; padding: 8px; background: rgba(0, 255, 65, 0.05); box-shadow: 0 0 5px rgba(0,255,65,0.2); }
        .box-label { font-size: 8px; letter-spacing: 1px; opacity: 0.7; margin-bottom: 2px; }
        .box-value { font-size: 16px; font-weight: bold; color: #0f0; text-shadow: 0 0 5px #00ff41; }

        /* 輸入區域 (保留功能但視覺升級) */
        .config-panel { padding: 10px; border-top: 2px solid #00ff41; background: rgba(0, 255, 65, 0.08); display: flex; align-items: center; justify-content: center; gap: 8px; }
        input[type="number"] { background: #000; border: 1px solid #00ff41; color: #00ff41; font-family: 'Orbitron'; width: 100px; text-align: center; font-size: 16px; padding: 5px; }
        button { background: #00ff41; color: #000; border: none; font-family: 'Orbitron'; font-weight: bold; padding: 6px 15px; border-radius: 2px; cursor: pointer; text-transform: uppercase; }
        button:active { background: #008f11; }

        /* 核武警報樣式 (當跌幅超過 -4% 時啟用) */
        @keyframes pulse { 0% { box-shadow: 0 0 10px #ff0000; } 50% { box-shadow: 0 0 25px #ff0000; } 100% { box-shadow: 0 0 10px #ff0000; } }
        .nuke-alert { border: 2px solid #ff0000 !important; color: #ff0000 !important; background: rgba(255,0,0,0.1); animation: pulse 1s infinite; }
        .nuke-label { color: #ff0000 !important; }
        .critical-value { color: #ff0000 !important; text-shadow: 0 0 10px #ff0000 !important; }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="cockpit">
        <div class="header">
            <h1>SYSTEM: DLTRS V200.0</h1>
            <p>[ 幽靈轟炸機・核武作戰終端 ]</p>
        </div>

        <div class="tactical-grid">
            <div class="data-panel">
                <div class="data-box"><div class="box-label">1YR ATH LOCK (高點鎖定)</div><div id="curAth" class="box-value">30,418.00</div></div>
                <div class="data-box nuke-alert" style="border-style: solid; color: #ff0000; background: rgba(255,0,0,0.2);"><div class="box-label" style="color: #ff0000;">NDX REAL-TIME (即時高度)</div><div class="box-value critical-value" style="color: #ff0000;">18,250</div></div>
                <div id="dropBox" class="data-box"><div id="dropLabel" class="box-label">DROP % (偏離度)</div><div id="dropVal" class="box-value">-22.45%</div></div>
            </div>

            <div class="war-zone">
                <div class="war-zone-label">敵方防空陣地圖</div>
                <svg id="war-map" viewBox="0 0 200 100">
                    <defs>
                        <linearGradient id="enemyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#ff0000;stop-opacity:0" />
                            <stop offset="50%" style="stop-color:#ff0000;stop-opacity:0.3" />
                            <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0" />
                        </linearGradient>
                    </defs>
                    <path class="enemy-chart" d="M10,50 Q50,20 100,60 T190,40" />
                    <rect x="0" y="30" width="200" height="40" fill="url(#enemyGrad)" opacity="0.1" />
                    
                    <g transform="translate(100, 30)">
                        <path class="plane" d="M0,0 L20,10 L-20,10 Z" />
                        <text x="-25" y="-5" fill="#00ff41" font-size="5">B-2 先遣轟炸</text>
                        <g class="falling-bombs">
                            <circle class="bombs" cx="-5" cy="12" r="1"/>
                            <circle class="bombs" cx="5" cy="12" r="1"/>
                            <circle class="bombs" cx="0" cy="15" r="1"/>
                        </g>
                    </g>
                </g>
                </svg>
            </div>
        </div>

        <div class="config-panel">
            <input type="number" id="athInput" value="30418">
            <button onclick="updateTargetATH()">LOCK & LOAD</button>
        </div>
    </div>

    <script>
        function updateTargetATH() {
            const ath = document.getElementById('athInput').value;
            const price = 29416.75; // 固定回測價位 (完美版的核心數據)
            const drop = ((price - ath) / ath) * 100;
            
            // 數值同步
            document.getElementById('curAth').innerText = Number(ath).toLocaleString();
            document.getElementById('dropVal').innerText = drop.toFixed(2) + "%";
            
            // 警報控制
            const dropBox = document.getElementById('dropBox');
            const dropLabel = document.getElementById('dropLabel');
            const dropVal = document.getElementById('dropVal');
            
            if (drop <= -4) {
                dropBox.classList.add("nuke-alert");
                dropVal.classList.add("critical-value");
                dropLabel.classList.add("nuke-label");
                // 同時把標題文字改為核武警報
                document.querySelector('.header p').innerText = "[ B-2 GHOST: READY ]";
                document.querySelector('.header p').style.color = "#ff0000";
            } else {
                dropBox.classList.remove("nuke-alert");
                dropVal.classList.remove("critical-value");
                dropLabel.classList.remove("nuke-label");
                document.querySelector('.header p').innerText = "[ 幽靈轟炸機・核武作戰終端 ]";
                document.querySelector('.header p').style.color = "#aaa";
            }
        }
        // 初始化
        updateTargetATH();
    </script>
</body>
</html>
