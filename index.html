<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLTRS V100.1 - 戰略控制台</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; margin: 0; padding-bottom: 50px; }
        .cockpit { width: 100vw; min-height: 100vh; border: 4px solid #1a331a; box-sizing: border-box; position: relative; }
        .header { text-align: center; border-bottom: 2px solid #00ff41; padding: 15px; font-size: 20px; font-weight: bold; background: rgba(0, 255, 65, 0.1); }
        .input-zone { padding: 15px; border: 1px dashed #00ff41; margin: 10px; background: rgba(0,255,65,0.05); text-align: center; }
        input { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 10px; width: 80%; font-size: 18px; margin: 10px 0; text-align: center; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; font-weight: bold; width: 80%; cursor: pointer; }
        .data-panel { padding: 10px; }
        .data-box { border: 1px solid #00ff41; padding: 10px; margin-bottom: 10px; }
        .label { font-size: 12px; color: #8f8; }
        .value { font-size: 24px; font-weight: bold; }
        .status-box { width: 80%; margin: 20px auto; padding: 15px; border: 2px dashed #00ff41; text-align: center; opacity: 0.3; }
        .active { border: 2px solid #ff0000; color: #ff0000; opacity: 1; box-shadow: 0 0 20px #ff0000; background: rgba(255,0,0,0.1); }
    </style>
</head>
<body>
    <div class="cockpit">
        <div class="header">DLTRS V100.1 COMMANDER</div>
        <div class="input-zone">
            <div class="label">SET 1YR ATH (手動輸入高點)</div>
            <input type="number" id="athInput" value="30418">
            <button onclick="calculate()">LOCK & LOAD</button>
        </div>
        <div class="data-panel">
            <div class="data-box"><div class="label">CURRENT ATH</div><div id="curAth" class="value">30,418.00</div></div>
            <div class="data-box"><div class="label">DROP % (偏離度)</div><div id="dropDisplay" class="value">-3.29%</div></div>
        </div>
        <div id="statusBox" class="status-box">
            <div style="font-size: 10px;">AERIAL STATUS</div>
            <div id="msg" style="font-weight: bold; margin-top: 10px;">SECURE: MONITORING</div>
        </div>
    </div>
    <script>
        function calculate() {
            const ath = document.getElementById('athInput').value;
            const price = 29416.75;
            const drop = ((price - ath) / ath) * 100;
            document.getElementById('curAth').innerText = Number(ath).toLocaleString();
            document.getElementById('dropDisplay').innerText = drop.toFixed(2) + "%";
            const box = document.getElementById('statusBox');
            const msg = document.getElementById('msg');
            if (drop <= -4) {
                box.className = "status-box active";
                msg.innerText = "B-2 SPIRIT: COMBAT READY";
            } else {
                box.className = "status-box";
                msg.innerText = "SECURE: MONITORING";
            }
        }
    </script>
</body>
</html>
